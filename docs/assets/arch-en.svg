<rect x="283.5" y="260.0" width="44" height="18" rx="9" fill="#120f24" stroke="#7c3aed99"/><text class="s" x="305.5" y="272.5" font-size="10" font-weight="600" fill="#c4b5fd" text-anchor="middle">HTTP</text>
