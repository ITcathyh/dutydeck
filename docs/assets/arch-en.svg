<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" width="1000" height="410" role="img" aria-label="Architecture: Lark, the Web workbench and CLI/HTTP triggers connect to the Dutydeck daemon on your machine, which drives local agents over PTY or ACP">
<defs>
<linearGradient id="lg-bg" x1="8" y1="5" x2="57" y2="61" gradientUnits="userSpaceOnUse"><stop stop-color="#292b31"/><stop offset="1" stop-color="#090a0d"/></linearGradient>
<linearGradient id="lg-beam" x1="18" y1="45" x2="48" y2="17" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset="1" stop-color="#b8b9c2"/></linearGradient>
<linearGradient id="lg-pulse" x1="38" y1="20" x2="50" y2="31" gradientUnits="userSpaceOnUse"><stop stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
<linearGradient id="arch-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#120f24"/><stop offset="1" stop-color="#0a1020"/></linearGradient>
<linearGradient id="core" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#3b1585"/><stop offset="1" stop-color="#1e0b4b"/></linearGradient>
<filter id="core-glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10"/></filter>
<clipPath id="frame"><rect width="1000" height="410" rx="24"/></clipPath>
<filter id="edge-blur" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="6"/></filter>
<style>
text{white-space:pre}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','Noto Sans Mono CJK SC',monospace}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.flow{animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-28}}
.breathe{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.25}50%{opacity:.75}}
</style>
</defs>
<rect width="1000" height="410" rx="24" fill="url(#arch-bg)"/>
<g clip-path="url(#frame)"><rect x="1" y="1" width="998" height="408" rx="24" fill="none" stroke="#a78bfa" stroke-opacity=".35" stroke-width="8" filter="url(#edge-blur)"/></g>
<rect x=".5" y=".5" width="999" height="409" rx="23.5" fill="none" stroke="#ffffff1f"/>
<text class="s" x="38" y="52" font-size="13" font-weight="600" fill="#a9a6d6">Interfaces</text>
