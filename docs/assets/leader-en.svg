<text class="s" x="276" y="32" font-size="12" font-weight="700" fill="#a9a6d6">2 · Leader plans</text>
<text class="s" x="522" y="32" font-size="12" font-weight="700" fill="#a9a6d6">3 · Workers build</text>
<text class="s" x="768" y="32" font-size="12" font-weight="700" fill="#a9a6d6">4 · Review &amp; escalate</text>
