<g class="hl3"><rect x="763" y="45" width="212" height="222" rx="13" fill="none" stroke="#a78bfa" stroke-width="4" filter="url(#glow)"/><rect x="764.5" y="46.5" width="209" height="219" rx="11.5" fill="none" stroke="#c4b5fd" stroke-width="1.5"/></g>
