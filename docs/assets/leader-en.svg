<text class="s" x="40" y="84" font-size="10.5" font-weight="400" fill="#ffffffcc">You · just now</text>
<text class="s" x="40" y="112" font-size="11.5" font-weight="400" fill="#1f2329">@bot Store order amounts</text>
<text class="s" x="40" y="130" font-size="11.5" font-weight="400" fill="#1f2329">in cents; add a migration</text>
<text class="s" x="40" y="148" font-size="11.5" font-weight="400" fill="#1f2329">and tests, staging first</text>
