<!doctype html>

<style>

  .nowline { display:inline-block; color:var(--grey); font-size:13px; margin-top:2px; padding:0 2px; margin-left:-2px; border-radius:4px; }

  /* 标注 */

  [5, 'p0', '删掉免责声明', '结果卡删掉「执行中曾有 N 个步骤失败，历史记录不代表仍有未解决问题」（左侧橙框）', 'run', 432],
  [6, 'p1', '「正在：…」实时刷新', '当前阶段加一行「正在：<最新一个工具的描述>」，每次调用工具都刷新；刚失败的一步显示为红字（点击跳到 1m 16s 看失败）', 'run', 76],
  [7, 'p1', '工具类型计数', '本阶段的工具类型计数，合计等于本阶段步数，替代「已执行 N 个步骤」', 'run', 192],
  [8, 'p1', '阶段图标，耗时右对齐', '阶段前加状态图标（进行中是加载动图），耗时右对齐；有失败的阶段保留现有的「● 有失败」', 'run', 192],
  [9, 'p1', '完成后收成一行', '完成后过程卡收成一行回执，不带标题栏；点「执行过程」可以展开阶段记录', 'run', 432],
  [10, 'p1', '长结果折叠', '结果超过约 800 字时，原样展示前约 500 字，其余折叠；点「展开全文」试试', 'run', 432],
  [11, 'p1', '@ 发起人', '群聊结果卡 @ 发起人，等结果的人会收到提醒（现有开关，默认关闭）', 'run', 432],
  [12, 'p1', '失败卡露出失败步骤', '失败卡加提示块：最后失败的步骤、命令、耗时、输出里的报错行。写「最后失败的步骤」而不是「失败原因」，因为现在拿不到任务级的失败原因', 'fail', 43]
];

let sceneKey = 'run', sc = SCENES.run, t = 192, playing = false, speed = 20, width = 580;
let ui = {}, lastState = '', hl = null, pinned = null, nowKey = '', nowAt = 0, renderKey = '';

function snapshot(t) {
  const done = t >= sc.end;
  const stages = sc.stages.filter(s => s.at <= t).map((s, i, arr) => {
    const tools = s.tools.filter(x => x[0] <= t).map(([at, kind, desc, dur, fail]) => ({ at, kind, desc, dur, fail, status: t < at + dur ? 'run' : fail ? 'fail' : 'ok' }));
    const text = [...s.texts].reverse().find(x => x[0] <= t)?.[1] ?? '';
    const next = arr[i + 1];
    const endAt = next ? next.at : done ? Math.max(s.at, ...tools.map(x => x.at + x.dur)) : t;
    const fails = tools.filter(x => x.status === 'fail').length, oks = tools.filter(x => x.status === 'ok').length;
    return { text, tools, elapsed: endAt - s.at, current: !next && !done, fails, oks };
  });
  return { t: Math.min(t, sc.end), done, state: done ? sc.final : 'running', stages, steps: stages.reduce((n, s) => n + s.tools.length, 0) };
}
const stageTitle = x => x.text || x.tools[0]?.desc || '执行过程';
const failLabel = x => x.fails ? (x.oks ? '有失败' : '失败') : '';
const kinds = tools => { const m = new Map(); for (const x of tools) m.set(x.kind, (m.get(x.kind) || 0) + 1); return [...m]; };
const open = (key, def) => ui[key] ?? def;
const toggle = (key, isOpen) => ` data-toggle="${key}" data-open="${isOpen}"`;

function header(color, title, sub, tag) {
  return `<div class="hd ${color}"><div class="tx"><div class="t"${attr(1)}>${esc(title)}</div><div class="s">${esc(sub)}</div></div>${tag ? `<span class="tag ${color}"${attr(2)}>${tag}</span>` : ''}</div>`;
}

// ---------- 现状 ----------
function oldCards(s) {
  const st = s.state, color = { running: 'blue', completed: 'green', failed: 'red' }[st], label = { running: '执行中', completed: '已完成', failed: '已失败' }[st];
  const cur = s.stages.find(x => x.current), hist = s.stages.filter(x => !x.current).reverse();
  const traceOpen = open('oldTrace', st !== 'completed');
  let body = `<div class="ph click"${attr(3)}${toggle('oldTrace', traceOpen)}><span>执行记录 · ${label} · 用时 ${fmt(s.t)}</span><span class="chev">${traceOpen ? '⌃' : '⌄'}</span></div>`;
  if (traceOpen) {
    if (cur) body += `<div class="cur"><div>${esc(cur.text || cur.tools[0]?.desc || '正在执行…')}${cur.fails ? `　<span class="failtxt">● ${failLabel(cur)}</span>` : ''}</div>${cur.tools.length ? `<div class="note"${attr(7)}>已执行 ${cur.tools.length} 个步骤${cur.fails ? `，${cur.fails} 个失败` : ''}</div>` : ''}</div>`;
    body += hist.map((x, i) => `<div class="hist"${attr(i === 0 ? 8 : 0)}>${esc(stageTitle(x))}　<span class="d">${fmt(x.elapsed)}</span>${x.fails ? `　<span class="failtxt">● ${failLabel(x)}</span>` : ''}</div>`).join('');
  }
  if (st === 'running') body += `<div class="row right">${stop + refresh}</div>`;
  if (st === 'failed') body += `<div class="row right">${retry}</div>`;
  if (st !== 'running') body += `<div class="row right"><span class="link">查看详情</span></div>`;
  const process = `<div class="card"${attr(st === 'completed' ? 9 : 0)}>${header(color, sc.prompt, sc.agent)}<div class="bd">${body}</div></div>`;
  if (st !== 'completed') return msg(process, sc.bot, sc.clock);
  const failed = s.stages.reduce((n, x) => n + x.fails, 0);
  const result = `<div class="card">${header('green', '执行结果 · ' + sc.prompt, sc.agent)}<div class="bd"><div class="md"${attr(10)}>${ANSWER_HEAD}${ANSWER_REST}</div>
    ${failed ? `<div class="note"${attr(5)}>ⓘ 执行中曾有 ${failed} 个步骤失败，历史记录不代表仍有未解决问题。</div>` : ''}
    <div class="foot"><span>用时 ${fmt(s.t)}</span><span class="link">查看详情</span></div></div></div>`;
  return `<div class="stack">${msg(process, sc.bot, sc.clock)}${msg(result, sc.bot, sc.endClock)}</div>`;
}

// ---------- 方案 ----------
function timeline(s, terminal) {
  const cur = terminal ? null : s.stages.find(x => x.current);
  const hist = s.stages.filter(x => x !== cur).reverse();
  let html = '';
  if (cur) {
    const last = cur.tools.at(-1);
    const title = cur.text || last?.desc || '正在执行…';
    let now = '';
    if (cur.text && last) {
      const key = `${sceneKey}|${last.at}|${last.status === 'fail'}`;
      if (key !== nowKey) { nowKey = key; nowAt = performance.now(); }
      const text = last.status === 'fail' ? `<span class="bad">失败：${esc(last.desc)}</span>` : `正在：${esc(last.desc)}`;
      now = `<div><span class="nowline flash"${attr(6)} style="animation-delay:-${((performance.now() - nowAt) / 1000).toFixed(2)}s">${text}</span></div>`;
    }
    const counts = kinds(cur.tools);
    const spin = `<svg class="spinning" style="animation-delay:-${((performance.now() / 1000) % 0.9).toFixed(2)}s"><use href="#spin"/></svg>`;
    html += `<div class="st now"><span class="dot">${spin}</span><div class="body"><div class="a">${esc(title)}</div>${now}
      ${counts.length ? `<div><span class="chips"${attr(7)}>${counts.map(([k, n]) => `<span class="chip">${k} ${n}</span>`).join('')}</span></div>` : ''}</div><span class="d">${fmt(cur.elapsed)}</span></div>`;
  }
  html += hist.map((x, i) => `<div class="st past"${attr(i === 0 ? 8 : 0)}><span class="dot">${ic(x.fails && !x.oks ? 'fail' : 'doneline', '')}</span>
    <div class="body">${esc(stageTitle(x))}${x.fails && x.oks ? `　<span class="failtxt">● 有失败</span>` : ''}</div><span class="d">${fmt(x.elapsed)}</span></div>`).join('');
  return `<div class="tl">${html}</div>`;
}

function newCards(s) {
  const st = s.state;
  if (st === 'completed') {
    const rOpen = open('receipt', false), fOpen = open('fold', false);
    const receipt = `<div class="card"${attr(9)}><div class="receipt click"${toggle('receipt', rOpen)}><span class="l">${ic('done')}<b>已完成</b>· ${s.steps} 步 · 结果见下条</span><span class="greylink">执行过程 ${rOpen ? '⌃' : '⌄'}</span></div>
      ${rOpen ? `<div class="bd" style="padding-top:0">${timeline(s, true)}</div>` : ''}</div>`;
    const result = `<div class="card">${header('green', sc.title, sc.agent, '已完成')}<div class="bd"><div class="md">${ANSWER_HEAD}${fOpen ? ANSWER_REST : ''}</div>
      <div class="fold click"${attr(10)}${toggle('fold', fOpen)}><span>${fOpen ? '收起全文' : '展开全文 · 还有约 3,600 字'}</span><span class="chev">${fOpen ? '⌃' : '⌄'}</span></div>
      <div class="foot"><span><span style="color:var(--blue)"${attr(11)}>@黄宇航</span>　用时 ${fmt(s.t)}</span><span class="link">查看详情</span></div></div></div>`;
    return `<div class="stack">${msg(receipt, sc.bot, sc.clock)}${msg(result, sc.bot, sc.endClock)}</div>`;
  }
  const failed = st === 'failed';
  let body = '';
  if (failed) {
    const lastFail = s.stages.flatMap(x => x.tools).filter(x => x.status === 'fail').at(-1);
    body += `<div class="callout red"${attr(12)}>${ic('warn')}<div>${lastFail
      ? `<b>最后失败的步骤：${esc(lastFail.desc)}</b><div class="note" style="color:#8F3B35"><code>${esc(lastFail.fail.cmd)}</code> · ${fmt(lastFail.dur)} · 输出末行 <code>${esc(lastFail.fail.err)}</code></div>`
      : '<b>任务失败，执行记录里没有失败的步骤</b>'}</div></div>`;
  }
  body += timeline(s, failed);
  body += failed
    ? `<div class="row between"><span class="note"${attr(3)}>用时 ${fmt(s.t)} · <span class="greylink">查看详情</span></span><span class="row">${retry}</span></div>`
    : `<div class="row between"><span class="note"${attr(3)}>已运行 ${fmt(s.t)} · 共 ${s.steps} 步</span><span class="row">${stop + refresh}</span></div>`;
  return msg(`<div class="card">${header(failed ? 'red' : 'blue', sc.title, sc.agent, failed ? '失败' : '执行中')}<div class="bd">${body}</div></div>`, sc.bot, sc.clock);
}

function chatItem(s, side) {
  const st = s.state, cur = s.stages.find(x => x.current);
  const label = { running: '执行中', completed: '已完成', failed: '已失败' }[st];
  const text = side === 'A'
    ? `${st === 'completed' ? '执行结果' : '执行过程'} · ${sc.prompt} · ${label}`
    : st === 'running' ? `执行中 · ${cur?.text || cur?.tools.at(-1)?.desc || '正在执行…'}` : `${st === 'failed' ? '失败' : '已完成'} · ${sc.title}`;
  const time = st === 'completed' ? sc.endClock : sc.clock;
  return `<div class="cl"${attr(4)}><div class="gav">群</div><div class="clx"><div class="cln"><b>${esc(sc.group)}</b><span>${time}</span></div><div class="clp">${esc(sc.bot)}：${esc(text)}</div></div></div>`;
}

// ---------- 渲染与交互 ----------
function applyHighlight() {
  const n = pinned ?? hl;
  document.querySelectorAll('.m [data-n], #clA [data-n], #clB [data-n]').forEach(el => el.classList.toggle('hl', String(el.dataset.n) === String(n)));
  document.querySelectorAll('#legend li').forEach(li => li.classList.toggle('on', li.dataset.n === String(pinned)));
  const note = NOTES.find(x => String(x[0]) === String(n));
  $('#detail').innerHTML = note ? `<b>${note[0]}. ${esc(note[2])}</b>：${esc(note[3])}` : '悬停查看每项改动的说明；卡片上的蓝色数字对应这里的编号。';
}
function render(force = false) {
  const s = snapshot(t);
  if (s.state !== lastState) { delete ui.oldTrace; lastState = s.state; }
  const running = s.state === 'running';
  // 执行中每帧重绘才能让「正在：…」的高亮和转圈连续；其余时刻只在状态变化时重绘，避免点击落空。
  const key = `${sceneKey}|${Math.floor(t)}|${JSON.stringify(ui)}|${width}`;
  if (!force && key === renderKey && !running) return;
  if (!force && key === renderKey && running && !playing) return;
  renderKey = key;
  document.querySelectorAll('.m, #clA, #clB').forEach(el => el.style.setProperty('--w', width + 'px'));
  $('#A').innerHTML = oldCards(s); $('#B').innerHTML = newCards(s);
  $('#clA').innerHTML = chatItem(s, 'A'); $('#clB').innerHTML = chatItem(s, 'B');
  const hA = Math.round($('#A').getBoundingClientRect().height), hB = Math.round($('#B').getBoundingClientRect().height);
  $('#hA').innerHTML = `屏幕占用高度 <b>${hA}px</b>`;
  $('#hB').innerHTML = `屏幕占用高度 <b>${hB}px</b>（${hB <= hA ? '−' : '+'}${Math.abs(Math.round((1 - hB / hA) * 100))}%）`;
  $('#scrub').value = Math.floor(t);
  $('#clock').textContent = `${fmt(t)} / ${fmt(sc.end)}　${{ running: '执行中', completed: '已完成', failed: '已失败' }[s.state]}`;
  $('#play').textContent = playing ? '❚❚ 暂停' : '▶ 播放';
  applyHighlight();
}
function setScene(key, at) {
  sceneKey = key; sc = SCENES[key]; ui = {}; lastState = '';
  t = at ?? 0; playing = false; speed = sc.speed; $('#speed').value = String(speed);
  $('#scrub').max = sc.end;
  $('#sceneSeg').innerHTML = Object.entries(SCENES).map(([k, v]) => `<button data-k="${k}" class="${k === key ? 'on' : ''}">${v.label}</button>`).join('');
  $('#marks').innerHTML = sc.marks.map(([at, name]) => `<button data-t="${at}">${name}</button>`).join('');
  render(true);
}

$('#sceneSeg').addEventListener('click', e => { const k = e.target.dataset.k; if (k) { pinned = null; setScene(k); } });
$('#marks').addEventListener('click', e => { if (e.target.dataset.t) { t = Number(e.target.dataset.t); playing = false; render(true); } });
$('#scrub').addEventListener('input', e => { t = Number(e.target.value); playing = false; render(true); });
$('#speed').addEventListener('change', e => { speed = Number(e.target.value); });
$('#play').addEventListener('click', () => { if (t >= sc.end) { t = 0; ui = {}; } playing = !playing; render(true); });
$('#reset').addEventListener('click', () => { t = 0; ui = {}; playing = true; render(true); });
$('#widthSeg').addEventListener('click', e => { if (!e.target.dataset.w) return; width = Number(e.target.dataset.w); document.querySelectorAll('#widthSeg button').forEach(b => b.classList.toggle('on', b === e.target)); render(true); });
$('#annot').addEventListener('change', e => document.body.classList.toggle('annot', e.target.checked));
// 播放时卡片在不断重绘，用 pointerdown 而不是 click，按下即生效。
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-toggle]'); if (!el) return;
  ui[el.dataset.toggle] = el.dataset.open !== 'true'; render(true);
});
$('#legend').innerHTML = NOTES.map(([n, p, short]) => `<li data-n="${n}"><span class="num">${n}</span><span class="pz ${p}">${p.toUpperCase()}</span>${esc(short)}</li>`).join('');
$('#legend').addEventListener('mouseover', e => { const li = e.target.closest('li'); if (li) { hl = li.dataset.n; applyHighlight(); } });
$('#legend').addEventListener('mouseout', e => { if (!e.relatedTarget?.closest?.('#legend li')) { hl = null; applyHighlight(); } });
$('#legend').addEventListener('click', e => {
  const li = e.target.closest('li'); if (!li) return;
  const note = NOTES.find(x => String(x[0]) === li.dataset.n);
  if (pinned === note[0]) { pinned = null; applyHighlight(); return; }
  pinned = note[0];
  if (note[4] !== sceneKey) setScene(note[4], note[5]); else { t = note[5]; playing = false; ui = {}; render(true); }
});

let lastTs = performance.now();
setInterval(() => {
  const ts = performance.now(), dt = (ts - lastTs) / 1000; lastTs = ts;
  if (playing) { t = Math.min(sc.end, t + dt * speed); if (t >= sc.end) playing = false; render(); }
}, 50);
document.body.classList.add('annot');
// 地址参数：#fail@43、#run@432,w320,fold,receipt，用于直接打开某个时刻。
const [, hs, ht, rest = ''] = location.hash.match(/^#(run|fail)@(\d+)(.*)$/) ?? [];
if (rest.includes('w320')) width = 320;
document.querySelectorAll('#widthSeg button').forEach(b => b.classList.toggle('on', Number(b.dataset.w) === width));
setScene(hs ?? 'run', ht ? Number(ht) : 192);
for (const k of ['fold', 'receipt']) if (rest.includes(k)) ui[k] = true;
render(true);
</script>
</body></html>
