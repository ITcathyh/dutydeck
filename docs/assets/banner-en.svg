  <text x="920" y="99" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="start" >Running</text>
  <circle cx="1170" cy="94" r="5" fill="#fff" class="pulse"/>
