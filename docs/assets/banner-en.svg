  <rect x="972" y="212" width="250" height="96" rx="14" fill="#ffffff"/>
  <path d="M986 212h222a14 14 0 0 1 14 14v28H972v-28a14 14 0 0 1 14-14z" fill="#2ea121"/>
  <text x="990" y="238" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="start" >✓ Done · Verified</text>
  <rect x="990" y="270" width="96" height="10" rx="5" fill="#d9f2d4"/>
  <rect x="1094" y="270" width="64" height="10" rx="5" fill="#ffd9d6"/>
