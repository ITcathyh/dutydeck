<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Dutydeck">
<defs>
  <linearGradient id="lg-bg" x1="8" y1="5" x2="57" y2="61" gradientUnits="userSpaceOnUse"><stop stop-color="#292b31"/><stop offset="1" stop-color="#090a0d"/></linearGradient>
  <linearGradient id="lg-beam" x1="18" y1="45" x2="48" y2="17" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset="1" stop-color="#b8b9c2"/></linearGradient>
  <linearGradient id="lg-pulse" x1="38" y1="20" x2="50" y2="31" gradientUnits="userSpaceOnUse"><stop stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d0b1a"/><stop offset=".55" stop-color="#161032"/><stop offset="1" stop-color="#0a1222"/></linearGradient>
  <radialGradient id="glow-a" cx="0" cy="0" r="1" gradientTransform="translate(1010 150) scale(420 300)" gradientUnits="userSpaceOnUse"><stop stop-color="#7c3aed" stop-opacity=".55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow-b" cx="0" cy="0" r="1" gradientTransform="translate(170 300) scale(380 240)" gradientUnits="userSpaceOnUse"><stop stop-color="#3370ff" stop-opacity=".35"/><stop offset="1" stop-color="#3370ff" stop-opacity="0"/></radialGradient>
  <linearGradient id="word" x1="284" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff"/></pattern>
  <clipPath id="frame"><rect width="1280" height="360" rx="28"/></clipPath>
  <style>
    .float-a { animation: float 6s ease-in-out infinite; }
    .float-b { animation: float 6s ease-in-out -3s infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    .bar { transform-box: fill-box; transform-origin: left; animation: grow 3.6s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-8px) } }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1 } 50% { transform: scale(1.35); opacity: .75 } }
    @keyframes grow { 0% { transform: scaleX(.15) } 70%,100% { transform: scaleX(1) } }
  </style>
</defs>
<g clip-path="url(#frame)">
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#dots)" opacity=".07"/>
  <rect width="1280" height="360" fill="url(#glow-a)"/>
  <rect width="1280" height="360" fill="url(#glow-b)"/>
</g>
<rect x=".5" y=".5" width="1279" height="359" rx="27.5" fill="none" stroke="#ffffff1f"/>
<g transform="translate(96 100) scale(2.375)">
  <rect width="64" height="64" rx="16" fill="url(#lg-bg)" stroke="#ffffff22"/>
  <path d="M42 17H29c-8.3 0-15 6.7-15 15s6.7 15 15 15h13" fill="none" stroke="url(#lg-beam)" stroke-width="5" stroke-linecap="round"/>
  <path d="M42 25H30a7 7 0 0 0 0 14h12" fill="none" stroke="#71717a" stroke-width="4" stroke-linecap="round"/>
  <circle class="pulse" cx="45" cy="25" r="5" fill="url(#lg-pulse)" stroke="#ddd6fe" stroke-width="1.5"/>
  <circle cx="45" cy="39" r="3" fill="#f4f4f5"/>
</g>
<text x="282" y="186" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="88" font-weight="800" fill="url(#word)" text-anchor="start" letter-spacing="-2">Dutydeck</text>
<text x="286" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="28" font-weight="600" fill="#ecebff" text-anchor="start" >Your coding agents, on duty in Lark</text>
<text x="286" y="264" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="15" font-weight="400" fill="#a9a6d6" text-anchor="start" >Local-first · Dispatch from chat · Approve on phone · Verified results</text>
