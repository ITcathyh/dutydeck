<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Flow: dispatch in Lark → approve on phone → server-side verification → result card">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#120f24"/><stop offset="1" stop-color="#0a1020"/></linearGradient>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
<clipPath id="frame"><rect width="1000" height="260" rx="20"/></clipPath>
<filter id="edge-blur" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="6"/></filter>
<style>
text{white-space:pre}
.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','Noto Sans Mono CJK SC',monospace}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.hl0{opacity:0;animation:hl0 10s ease-in-out infinite}
@keyframes hl0{0%,0%{opacity:0}3%,22%{opacity:1}26%,100%{opacity:0}}
.hl1{opacity:0;animation:hl1 10s ease-in-out infinite}
@keyframes hl1{0%,24%{opacity:0}28%,47%{opacity:1}51%,100%{opacity:0}}
.hl2{opacity:0;animation:hl2 10s ease-in-out infinite}
@keyframes hl2{0%,49%{opacity:0}53%,72%{opacity:1}76%,100%{opacity:0}}
.hl3{opacity:0;animation:hl3 10s ease-in-out infinite}
@keyframes hl3{0%,74%{opacity:0}78%,97%{opacity:1}100%,100%{opacity:0}}
.dot{animation:dot 1.6s linear infinite}
@keyframes dot{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(30px);opacity:0}}
.wire{animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
</style>
</defs>
<rect width="1000" height="260" rx="20" fill="url(#bg)"/>
<g clip-path="url(#frame)"><rect x="1" y="1" width="998" height="258" rx="20" fill="none" stroke="#a78bfa" stroke-opacity=".35" stroke-width="8" filter="url(#edge-blur)"/></g>
